[package]
name = "snerdmq"
version = "0.2.5"
edition = "2024"
description = "A lightweight, robust, asynchronous background job queue polyglot IPC daemon."
license = "MIT"
repository = "https://github.com/greyhands2/snerdmq"
exclude = [
    "assets/*.mov",
    "assets/*.gif",
    "assets/*.html",
    ".snerdata/*",
    ".DS_Store"
]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.17.0"
fs3 = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-std", "io-util"] }
uuid = { version = "1.24.0", features = ["v4"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3.27.0"
