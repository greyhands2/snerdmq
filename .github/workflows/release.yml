name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  build-and-upload:
    name: Build and Upload
    runs-on: ${{ matrix.os }}
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: snerdmq-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            file: snerdmq-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            file: snerdmq-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            file: snerdmq-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: snerdmq-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            file: snerdmq-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/snerdmq target/${{ matrix.target }}/release/${{ matrix.file }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv target/${{ matrix.target }}/release/snerdmq.exe target/${{ matrix.target }}/release/${{ matrix.file }}

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.file }}
